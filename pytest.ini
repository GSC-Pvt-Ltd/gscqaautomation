[pytest]
testpaths = tests
markers =
    smoke: fast checks that run on every build
    regression: full suite, nightly and pre-release
    write: creates or modifies records - skipped when QA_READ_ONLY=true
    case(id): the catalogue ID this test automates, e.g. TC-0142
    priority(level): P1 blocks a release, P2 does not
addopts = -v --strict-markers --tb=short
